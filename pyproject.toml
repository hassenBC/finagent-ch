[project]
name = "finagent"
version = "0.1.0"
description = "A measured, permission-aware LLM agent over Swiss financial documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "openai>=1.50",
    "mcp>=1.2",
    "sqlglot>=25",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13",
]

# Heavy ML stack. Pick exactly one:
#   CPU only:     uv sync --extra cpu
#   laptop GPU:   uv sync --extra gpu   (CUDA 12.9 wheels, driver >= 525)
[project.optional-dependencies]
cpu = ["torch>=2.13,<2.14", "torchvision>=0.28,<0.29", "sentence-transformers>=3", "docling>=2"]
gpu = ["torch>=2.13,<2.14", "torchvision>=0.28,<0.29", "sentence-transformers>=3", "docling>=2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Postgres (make db-up)"]
